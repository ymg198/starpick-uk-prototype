<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StarPick — Everything you need, delivered with confidence</title>
  <meta name="description" content="StarPick UK prototype: recommendations, keyword search, product details, reviews and head-to-head PK.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%230071e3' d='M12 2l3.1 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.6 21.4l1.5-7.1L1.7 9.4l7.2-.8z'/></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="#/" aria-label="StarPick home">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 2l3.1 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.8 5.6 21.4l1.5-7.1L1.7 9.4l7.2-.8z"/></svg>
        StarPick
      </a>
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Search trainers, coffee, headphones…" autocomplete="off" aria-label="Search products">
        <div id="suggest" class="suggest" hidden></div>
      </div>
      <nav class="tabs">
        <a class="tab" data-tab="home" href="#/">Today</a>
        <a class="tab" data-tab="search" href="#/search">Browse</a>
        <a class="tab" data-tab="compare" href="#/compare">PK <span id="pk-count" class="count-badge" hidden>0</span></a>
        <a class="tab basket" href="javascript:void 0" aria-label="Basket">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 8h14l-1.5 11h-11z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
          <span id="basket-count" class="count-badge" hidden>0</span>
        </a>
        <button class="avatar-btn" id="avatar" aria-label="Sign in" aria-haspopup="dialog"></button>
      </nav>
    </div>
  </header>

  <main id="view" class="container"></main>

  <div id="signin-backdrop" class="backdrop" hidden></div>
  <div id="signin" class="signin card" role="dialog" aria-modal="true" aria-labelledby="signin-title" hidden></div>
  <div id="pk-tray" class="pk-tray"></div>
  <div id="toast" class="toast" role="status"></div>

  <footer class="footer container">
    <p>StarPick prototype · sample products and reviews for demo only · Prices in GBP incl. VAT · <a href="../">Back to the FamilyWise edition</a></p>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
